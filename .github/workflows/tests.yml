name: Unit Tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements*.txt"
      - "pytest.ini"
      - "docs/index.html"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "requirements*.txt"
      - "pytest.ini"
      - "docs/index.html"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest
